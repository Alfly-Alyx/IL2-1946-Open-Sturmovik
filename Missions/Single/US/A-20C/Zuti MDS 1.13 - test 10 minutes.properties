Name Zuti MDS 1.13 - essai 10 minutes
Short Mission de validation Zuti/MDS. Rester en mission au moins dix minutes, puis revenir au menu principal et quitter proprement.
Description Validation de Zuti MDS 1.13 sur IL-2 1946 4.09m.\n\nLe joueur demarre en A-20C. La mission contient des bases, radars, navires mobiles, limites d'appareils et parametres de rearmement, ravitaillement et reparation.\n\nPendant dix minutes : laisser la simulation active, observer les unites et ouvrir la carte. Ne pas interrompre le jeu par le Gestionnaire des taches. Revenir ensuite au menu principal afin de verifier l'arret propre des minuteurs Zuti.

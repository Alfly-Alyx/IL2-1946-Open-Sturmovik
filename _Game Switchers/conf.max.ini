; Open Sturmovik 1.15 - profil haute qualite securise pour moteur x86.
; Le selecteur fusionne uniquement ces valeurs et conserve la resolution,
; le son, le reseau, les commandes et les autres preferences du joueur.
; La compression S3TC et les effets moderes limitent la pression memoire
; des textures 2K/4K pendant les essais de stabilisation.

[rts]
; Valeur de repli. Le selecteur calcule un masque allant jusqu'a quatre
; coeurs physiques lorsque Windows fournit une topologie exploitable.
ProcessAffinityMask=15

[Render_OpenGL]
TexQual=3
TexMipFilter=2
TexCompress=2
TexFlags.UseDither=1
TexFlags.UseAlpha=0
TexFlags.UseIndex=0
TexFlags.PolygonStipple=1
TexFlags.UseClampedSprites=0
TexFlags.DrawLandByTriangles=1
TexFlags.UseVertexArrays=1
TexFlags.DisableAPIExtensions=0
TexFlags.ARBMultitextureExt=1
TexFlags.TexEnvCombineExt=1
TexFlags.SecondaryColorExt=1
TexFlags.VertexArrayExt=1
TexFlags.ClipHintExt=1
TexFlags.UsePaletteExt=1
TexFlags.TexAnisotropicExt=1
TexFlags.TexCompressARBExt=1
; Le selecteur active ces extensions et le mode Perfect uniquement pour un
; GPU NVIDIA detecte. Les autres fournisseurs gardent ce profil ARB securise.
TexFlags.TexEnvCombine4NV=0
TexFlags.TexEnvCombineDot3=1
TexFlags.DepthClampNV=0
TexFlags.SeparateSpecular=1
TexFlags.TextureShaderNV=0
HardwareShaders=0
Shadows=2
Specular=2
SpecularLight=2
DiffuseLight=2
DynamicalLights=1
MeshDetail=2
VisibilityDistance=3
Sky=2
Forest=2
LandShading=3
LandDetails=2
; LandGeom=3 double la portee a 72 km, mais le patch 4.09m le reserve au
; mode Perfect. La base securisee reste a 36 km ; le selecteur passe a 3
; uniquement avec un profil Perfect compatible.
LandGeom=2
TexLarge=1
TexLandQual=3
TexLandLarge=1
TypeClouds=1
; Water=2 reste le chemin shader generique valide. Water=4 sera reserve
; au niveau maximal de la future reglette et aux backends valides.
Water=2
Effects=1
ForceShaders1x=0
PolygonOffsetFactor=-0.15
PolygonOffsetUnits=-3.0

[game]
; L'introduction historique est conservee dans l'add-on, mais elle reference
; actuellement des types de navires incompatibles et ralentit le diagnostic.
; Le futur lanceur pourra proposer de la reactiver une fois reparee.
Intro=0
NoLensFlare=0
3dgunners=1
Typeclouds=1
